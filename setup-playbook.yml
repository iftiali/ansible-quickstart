---
- name: Basic System Setup
  hosts: web
  become: true
  vars: 
    user_name: 'sean'
    package_state: 'latest'
    security_only: true
  tasks:
    - name: Update all security-related packages
      ansible.builtin.packages:
            name: "*"
            status: ""{{package_state}}""
            security: t""{{security_only}}""

    - name: Create a new user
      ansible.builtin.user:
            name: ""{{user_name}}""
            state: present
            craete_home: true